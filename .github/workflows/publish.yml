# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP: npm Trusted Publishing ───────────────────────────────────
#
# This workflow authenticates to npm via OIDC Trusted Publishing - no long-lived
# NPM_TOKEN secret, ever.
#
#   1. Trusted Publishing can't be configured for a package that has never been
#      published. Publish the very first version some other way first (e.g.
#      `npm login` and `npm publish` by hand, from a built `dist/`).
#   2. Log in to npmjs.com and open the package's settings.
#   3. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   4. Select GitHub Actions and fill in:
#        Organization or user: <your-github-org-or-username>
#        Repository:           <your-repo-name>
#        Workflow filename:    publish.yml   (filename only, not the full path)
#        Environment:          (leave blank unless you use GitHub Environments)
#   5. A newly added Trusted Publisher expires if it doesn't see a successful
#      publish within 2 days - don't set this up before you're ready to tag
#      the next release.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Ensure npm supports Trusted Publishing
        # OIDC trusted publishing needs npm 11.5.1+; the version bundled with
        # node-version: 'lts/*' above isn't guaranteed to already clear that bar.
        run: 'npm install -g npm@latest'

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write
        # above) via OIDC Trusted Publishing - see "ONE-TIME SETUP" at the top of
        # this file. Lint and build run automatically as part of the release process.
        run: 'npm run release'
